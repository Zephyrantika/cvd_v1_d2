# 零模型口径（预注册）。改动等于换口径，必须写进报告并重跑。
version: 1
updated: 2026-10-28

background:
  # 背景疾病怎么取：按表型 Jaccard 排除近似重复。
  # 不用家族：fold 0 的 91 个测试疾病只落在 17 个家族，一个家族占 75 个，
  # 按家族排除会把背景压到 16 个，z 系统性偏高。
  rule: phenotype_jaccard
  jaccard_threshold: 0.5

metric:
  # 特异性用逐基因超额分位：e(g,d) = r_d(g) - mean_{d'} r_d'(g)
  # 再对模块取均值。这样每个基因自己的热度被减掉，不会出现
  # "越冷门的模块 z 越高"。
  specificity: per_gene_excess_percentile
  top_k: 200

nulls:
  # 同构零模型：随机表型查询 → RWR → top-k → Leiden → 同一套指标
  random_module_draws: 10
  random_module_diseases: 10
  # 结构对照按模块大小匹配（|Δsize| <= size_tolerance）
  structure_size_tolerance: 5
